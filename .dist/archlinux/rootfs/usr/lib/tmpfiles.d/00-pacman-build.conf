# https://www.freedesktop.org/software/systemd/man/tmpfiles.d.html
C /home/egd                      0700 egd  egd  - /etc/skel
# working directory for building AUR packages (yay, bindfs, ...) with makepkg as the egd user.
d /tmp/pacman                    0755 egd  egd  -
# remove built packages from /tmp (makepkg PKGDEST), they are installed and no longer needed.
r /tmp/*.pkg.tar.zst
