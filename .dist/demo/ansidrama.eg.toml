# export DEMOPASSPHRASE="..."
# EDITOR=vim eg secrets edit chachasm://${DEMOPASSPHRASE}@.dist/demo/demo.env
# time systemd-run --user --pty --wait --working-directory=$PWD --setenv=EG_SSH_KEY_PATH=$PWD/.eg.demo/.ssh/eg --setenv=PATH -p RuntimeDirectory=eg-demo -p CacheDirectory=eg-demo eg secrets env --uri "chachasm://${DEMOPASSPHRASE}@.dist/demo/demo.env" ansidrama record .dist/demo/ansidrama.eg.toml
launch = "d=/tmp/.eg.demo; rm -rf $d && mkdir -p $d && cd $d && PS1='$ ' bash --norc --noprofile -i"
cols = 84
rows = 24
font = "smalti"
font_px = 16
card_font_px = 64
card_subtitle_px = 32
out = "ansidrama.eg.webp"
# TERM=screen-* stops eg (via termenv) from querying the terminal for its
# background colour, which ansidrama's embedded terminal never answers: without
# this every eg command stalls for 5s, silently, and the next scene types into it.
#
# GIT_* give `git commit` an identity, HOME is overridden so there is no ~/.gitconfig.
env = { COLORTERM = "truecolor", TERM = "screen-256color", GIT_AUTHOR_NAME = "Yu Sune", GIT_AUTHOR_EMAIL = "hopefully@egdaemon.com", GIT_COMMITTER_NAME = "Yu Sune", GIT_COMMITTER_EMAIL = "hopefully@egdaemon.com" }
wait_cap_ms = 3000
await_ms = 120000
# 2x playback: ansidrama has no speed knob, so halve the holds and the per-character
# typing delay (default 9cs). max_fps=30 floors a frame at ~3.3cs, so 4 is as fast as it goes cleanly.
type_cs = 4
quit_keys = ["C-d"]

[chrome]
style = "macos"
title = "eg · getting started"
padding = 12

[[scene]]
card = { lines = ["Getting Started", "your first eg module"], fg = "#fef9c3" }
hold_cs = 125

# a git repository with a remote, which eg expects
[[scene]]
text = "git init -q && git remote add origin https://github.com/egdaemon/demo.git"
hold_cs = 20
[[scene]]
keys = ["Enter"]
hold_cs = 40

# implementing your first module
[[scene]]
text = "eg actl bootstrap module"
hold_cs = 20
[[scene]]
keys = ["Enter"]
# the prompt is a row of exactly `$`; the command line above it also contains `$`.
await = { find = '^\$$', row = -1 }
hold_cs = 40

# eg compute local needs a commit to resolve HEAD
[[scene]]
text = "git add -A && git commit -qm 'initial commit'"
hold_cs = 20
[[scene]]
keys = ["Enter"]
hold_cs = 40

# run it locally
[[scene]]
text = "eg compute local --cores 4 --memory 4GiB"
hold_cs = 20
[[scene]]
keys = ["Enter"]
await = { find = '^\$$', row = -1 }
hold_cs = 150

# run it remotely
[[scene]]
text = "eg register"
hold_cs = 20
[[scene]]
keys = ["Enter"]
hold_cs = 150

[[scene]]
text = "eg compute upload --cores 4 --memory 4GiB"
hold_cs = 20
[[scene]]
keys = ["Enter"]
await = { find = '^\$$', row = -1 }
hold_cs = 200

[[scene]]
card = { lines = ["eg compute local", "eg compute upload"], fg = "#fef9c3" }
hold_cs = 125
