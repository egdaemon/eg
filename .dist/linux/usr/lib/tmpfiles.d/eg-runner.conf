# https://www.freedesktop.org/software/systemd/man/tmpfiles.d.html
# workload caches moved aside by eg-runner-build.service after a rebuild. R removes the directories entirely, it only
# applies to --remove (started in the background by the build, and by systemd-tmpfiles-setup at boot), not --clean.
R /var/cache/eg-runner/wcache.*.old     - - - -
R /var/cache/eg-runner-gpu/wcache.*.old - - - -
