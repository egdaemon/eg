syntax = "proto3";

package ci.repository;

message Repository {
  string id = 1 [ json_name = "id" ];
  string mimetype = 2 [ json_name = "mimetype" ];
  string account_id = 3 [ json_name = "account_id" ];
  string created_at = 4 [ json_name = "created_at" ];
  string updated_at = 5 [ json_name = "updated_at" ];
  string description = 6 [ json_name = "description" ];
  string vcs_uri = 9 [ json_name = "vcs_uri" ];
  string ssh_fingerprint = 10 [ json_name = "ssh_fingerprint" ];
  bool allow_shared = 11 [ json_name = "allow_shared" ];
  string clone_uri = 12 [ json_name = "clone_uri" ];
  reserved 13 to 99;
  string entry = 100 [ json_name = "entrypoint" ];
  string arch = 101 [ json_name = "arch" ];
  string os = 102 [ json_name = "os" ];
  uint64 cores = 103 [ json_name = "cores" ];
  uint64 memory = 104 [ json_name = "memory" ];
  uint64 vram = 105 [ json_name = "vram" ];
  uint64 ttl = 106 [ json_name = "ttl" ];
  reserved 107 to 999;
  repeated string labels = 1000 [ json_name = "labels" ];
}

message SearchRequest {
  string query = 1 [ json_name = "query" ];
  uint64 offset = 2 [ json_name = "offset" ];
  uint64 limit = 3 [ json_name = "limit" ];
  string vcs_uri = 4 [ json_name = "vcs_uri" ];
}
message SearchResponse {
  SearchRequest next = 1 [ json_name = "next" ];
  repeated Repository items = 2 [ json_name = "items" ];
}

message FindResponse { Repository repository = 1; }

message Workload {
  string path = 1 [ json_name = "path" ];
  string vcs_commit = 2 [ json_name = "vcs_commit" ];
  string updated_at = 3 [ json_name = "updated_at" ];
  string generation = 4 [ json_name = "generation" ];
}

message WorkloadSearchRequest {
  string query = 1 [ json_name = "query" ];
  string vcs_uri = 2 [ json_name = "vcs_uri" ];
  reserved 3 to 100;
  uint64 offset = 101 [ json_name = "offset" ];
  uint64 limit = 102 [ json_name = "limit" ];
}

message WorkloadSearchResponse {
  WorkloadSearchRequest next = 1 [ json_name = "next" ];
  repeated Workload items = 2 [ json_name = "items" ];
}
message CreateRequest { Repository repository = 1; }
message CreateResponse { Repository repository = 1; }

message UpdateRequest { Repository repository = 1; }
message UpdateResponse { Repository repository = 1; }

message DestroyRequest { Repository repository = 1; }
message DestroyResponse { Repository repository = 1; }

message SSHCredential {
  string id = 1 [ json_name = "id" ];
  string account_id = 2 [ json_name = "account_id" ];
  int64 created_at = 3 [ json_name = "created_at" ];
  int64 updated_at = 4 [ json_name = "updated_at" ];
  string fingerprint = 5 [ json_name = "fingerprint" ];
  string description = 6 [ json_name = "description" ];
  string public = 7 [ json_name = "public" ];
  string private = 8 [ json_name = "private" ];
}

message SSHGenKeyRequest {
  SSHCredential credential = 1;
  bytes seed = 2 [ json_name = "seed" ];
}
message SSHGenKeyResponse { SSHCredential credential = 1; }
message SSHSearchRequest {
  string query = 1;
  uint64 offset = 2;
  uint64 limit = 3;
}
message SSHSearchResponse {
  SearchRequest next = 1 [ json_name = "next" ];
  repeated SSHCredential items = 2 [ json_name = "items" ];
}

message SSHCreateRequest { SSHCredential credential = 1; }
message SSHCreateResponse { SSHCredential credential = 1; }

message SSHFindRequest { string fingerprint = 1; }
message SSHFindResponse { SSHCredential credential = 1; }

message SSHDestroyRequest { string fingerprint = 1; }
message SSHDestroyResponse { SSHCredential credential = 1; }
