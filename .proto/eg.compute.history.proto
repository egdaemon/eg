syntax = "proto3";

package eg.compute;

// the record of a completed workload, mirrors the control plane's history record.
message History {
  string id = 1 [ json_name = "id" ];
  string description = 2 [ json_name = "description" ];
  string created_at = 3 [ json_name = "created_at" ];
  string initiated_at = 4 [ json_name = "initiated_at" ];
  string completed_at = 5 [ json_name = "completed_at" ];
  int64 duration = 6 [ json_name = "duration" ];
  // 0 unknown, 1 failure, 2 completed, 3 cancelled.
  int32 result = 7 [ json_name = "result" ];
  string uploaded_by = 8 [ json_name = "uploaded_by" ];
  string vcs_uri = 9 [ json_name = "vcs_uri" ];
  string vcs_commit = 10 [ json_name = "vcs_commit" ];
  // p2p id of the runner that executed the workload.
  string p2p_id = 11 [ json_name = "p2p_id" ];
}

message HistoryFindResponse {
  History history = 1 [ json_name = "history" ];
  // short lived token for reading logs/analytics from the runner, only set
  // while the runner may still hold the data.
  string logs_token = 2 [ json_name = "logs_token" ];
}

message SearchHistoryRequest {
  string query = 1 [ json_name = "query" ];
  uint64 offset = 2 [ json_name = "offset" ];
  uint64 limit = 3 [ json_name = "limit" ];
  string vcs_uri = 4 [ json_name = "vcs_uri" ];
}

message SearchHistoryResponse {
  SearchHistoryRequest next = 1 [ json_name = "next" ];
  repeated History items = 2 [ json_name = "items" ];
}
