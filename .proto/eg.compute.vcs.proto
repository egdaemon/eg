syntax = "proto3";

package eg.eg.compute;

message GitCredentialsAutomatic {
} // used to signal using the local devices credentials.

message GitCredentialsHTTP {
  string username = 1 [ json_name = "username" ];
  string password = 2 [ json_name = "password" ];
}

// ssh credentials never include the private key, signing is delegated
// to the credential service, see GitSignRequest.
message GitCredentialsSSH {
  string username = 1 [ json_name = "username" ];
  bytes public_key = 2 [ json_name = "public_key" ]; // ssh wire format.
}

message GitSignRequest {
  bytes data = 1 [ json_name = "data" ];
  string algorithm = 2 [ json_name = "algorithm" ];
}

message GitSignatureSSH {
  string format = 1 [ json_name = "format" ];
  bytes blob = 2 [ json_name = "blob" ];
}

message GitAccessCredentials {
  oneof Credentials {
    GitCredentialsAutomatic automatic = 100;
    GitCredentialsHTTP git_http = 101;
    GitCredentialsSSH ssh = 102;
    GitSignatureSSH ssh_signature = 103;
  }
}

message GCPAccessCredentials {
  string id_token = 1 [ json_name = "id_token" ];
  string audience = 2 [ json_name = "audience" ];
  string impersonate_service_account = 3
      [ json_name = "impersonate_service_account" ];
}
