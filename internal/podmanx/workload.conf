# podman configuration for the containers eg runs within a workload container.
# podman never reads it on its own; eg writes it out and points CONTAINERS_CONF_OVERRIDE at it for
# the podman commands it runs, see podmanx.Environ.
#
# within a workload container podman runs as root of the workload's user namespace, the only user
# namespace between the workload and the host. its containers share that user namespace, so podman's
# masks over /proc are never locked and every container mounts a /proc of its own (private pid namespace,
# systemd as pid 1) at any depth. what remains is the workload's /proc/sys, which podman mounts read only.
[containers]
# fixes: crun: open `/proc/sys/net/ipv4/ping_group_range`: Read-only file system.
# podman sets net.ipv4.ping_group_range for every container with a network namespace of its own, which it
# writes through the workload's read only /proc/sys, the container never starts. the cost is unprivileged
# ping within those containers.
default_sysctls = []
# fixes: netavark: set sysctl net/ipv4/ip_forward: IO error: Read-only file system.
# root's podman defaults to a netavark bridge, which writes the sysctls of the workload's network namespace
# through the same read only /proc/sys. pasta, rootless podman's default network, writes none. it gives each
# container a network namespace of its own with public internet and host.containers.internal, which replaces
# --network host for the containers eg runs within a workload.
netns = "pasta"
